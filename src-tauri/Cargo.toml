[package]
name = "zync"
version = "0.1.0"
description = "A lightweight, fast, open-source Minecraft launcher"
authors = ["Jamielin53"]
edition = "2021"

[lib]
name = "zync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = "2"
uuid = { version = "1", features = ["v3", "v4"] }
chrono = "0.4"
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
